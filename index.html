<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Charge X Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone screen (390×844) scaled to fit the window, centred */
:root { --bg: #EDEDEB; --frame: #1F1F1F; --fg: #3A3A3A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E0E10; --frame: #2C2C31; --fg: #A6A6AD; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0E0E10; --frame: #2C2C31; --fg: #A6A6AD; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#phone { width: 390px; height: 844px; flex: none; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px var(--frame); transform-origin: center center; background: #FFFFFF; }
#phone.edge { border-radius: 0; box-shadow: none; }
#phone iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
<div id="stage"><div id="phone"><iframe id="app" src="app/Main.dc.html" title="Charge X"></iframe></div></div>
<script>
(function () {
  var phone = document.getElementById('phone');
  function fit() {
    var w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
    var pad = w > 520 ? 24 : 0;
    var s = Math.min((w - pad * 2) / 390, (h - pad * 2) / 844);
    phone.style.transform = 'scale(' + s + ')';
    phone.classList.toggle('edge', pad === 0);
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>

</body></html>
