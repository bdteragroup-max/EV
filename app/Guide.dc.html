<div data-theme="{{theme}}" ref="{{cxRef}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1F1F1F; font-family: Sarabun, 'Segoe UI', sans-serif; display: flex; flex-direction: column">
<div style="padding: 50px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="padding: 5px 11px; border-radius: 999px; background: #FFF1EB; color: #C42D00; font-size: 12.5px; font-weight: 700">การสอนใช้งาน</span>
<sc-if value="{{hasSlides}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; font-weight: 600; color: #6B6B6B">{{slideBadge}}</span>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{canAutoPlay}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{togglePlay}}" style="{{playBtnStyle}}">{{playLabel}}</button>
</sc-if>
<a href="{{finishHref}}" onClick="{{markDone}}" style="height: 34px; padding: 0 12px; border-radius: 999px; background: #F4F4F4; color: #3A3A3A; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center">ข้าม</a>
</div>
</div>

<div style="flex: 1; min-height: 0; padding: 6px 20px 10px; display: flex; flex-direction: column; justify-content: center; gap: 16px">
<sc-if value="{{isReplayed}}" hint-placeholder-val="{{ false }}">
<div style="align-self: center; padding: 6px 12px; border-radius: 999px; background: #FFF7F3; border: 1px solid #FDD3C3; font-size: 12px; font-weight: 600; color: #C42D00; display: flex; align-items: center; gap: 6px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10"></path></svg>
<span>แสดงการสอนใช้งานซ้ำจากเมนูตั้งค่า</span>
</div>
</sc-if>

<sc-if value="{{hasSlides}}" hint-placeholder-val="{{ true }}">
<div class="cx-tip" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 26px; overflow: hidden; box-shadow: 0 16px 36px rgba(0,0,0,0.08); display: flex; flex-direction: column">
<div style="position: relative; width: 100%; height: 270px; background: #F6F6F6; overflow: hidden">
<img src="{{curImg}}" alt="{{curTitle}}" style="width: 100%; height: 100%; object-fit: cover; display: block; background: #F6F6F6">
<span class="cx-badge" style="position: absolute; top: 14px; left: 14px; height: 28px; padding: 0 11px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; box-shadow: 0 6px 14px rgba(252,57,1,0.35)">{{pageBadge}}</span>
</div>
<div style="padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 8px; min-height: 156px">
<span style="font-family: Sarabun, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.35; color: #1F1F1F">{{curTitle}}</span>
<span style="font-size: 14.5px; line-height: 1.65; color: #5C5C5C">{{curDesc}}</span>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 7px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<button type="button" aria-label="{{d.aria}}" onClick="{{d.go}}" style="{{d.style}}"></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{noSlides}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px 20px; border-radius: 24px; border: 1px dashed #D4D4D4; background: #F6F6F6; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-size: 16px; font-weight: 700; color: #1F1F1F">ยังไม่มีหน้าการสอนใช้งาน</span>
<span style="font-size: 13.5px; color: #5C5C5C">กรุณาเพิ่มหน้าสไลด์จาก Back Office แล้วเปิดใหม่อีกครั้ง</span>
</div>
</sc-if>
</div>

<div style="padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EFEFEF; background: #FFFFFF">
<sc-if value="{{hasSlides}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{prev}}" style="flex: 1; height: 48px; border-radius: 14px; border: 1.5px solid #E0E0E0; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #3A3A3A; cursor: pointer">‹ ย้อนกลับ</button>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{next}}" style="flex: 1.4; height: 48px; border-radius: 14px; border: 0; background: {{accent}}; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #FFFFFF; cursor: pointer">ถัดไป ›</button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<a href="{{finishHref}}" onClick="{{markDone}}" style="flex: 1.4; height: 48px; border-radius: 14px; background: {{accent}}; font-size: 15.5px; font-weight: 700; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center">เริ่มใช้งาน</a>
</sc-if>
</div>
<button type="button" onClick="{{replay}}" style="align-self: center; height: 32px; padding: 0 12px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #6B6B6B; cursor: pointer">แสดงซ้ำตั้งแต่หน้าแรก</button>
</sc-if>
<sc-if value="{{noSlides}}" hint-placeholder-val="{{ false }}">
<a href="{{finishHref}}" onClick="{{markDone}}" style="height: 48px; border-radius: 14px; background: {{accent}}; font-size: 15.5px; font-weight: 700; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center">กลับเข้าสู่แอป</a>
</sc-if>
</div>
</div>
</x-dc>

  };
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(T[kind] || T.map);
}
seedSlides() {
  return [
    { id: 't1', title: 'ค้นหาสถานีชาร์จใกล้คุณ', desc: 'เปิดแผนที่ดูจุดชาร์จว่าง (หมุดสีเขียว) ตรวจสอบกำลังไฟ ระยะทาง และกดนำทางไปยังสถานีได้ทันที', img: this.tutImg('map') },
    { id: 't2', title: 'สแกน QR ที่ตู้ชาร์จ', desc: 'จอดรถ เสียบหัวชาร์จเข้ากับรถ แล้วกดปุ่มชาร์จตรงกลางเมนูด้านล่างเพื่อสแกน QR บนตู้ชาร์จ', img: this.tutImg('qr') },
    { id: 't3', title: 'ติดตามสถานะชาร์จแบบเรียลไทม์', desc: 'ตรวจสอบเปอร์เซ็นต์แบตเตอรี่ กำลังไฟ (kW) และค่าบริการตลอดเวลา พร้อมแจ้งเตือนเมื่อใกล้เต็มหรือครบ 5 นาที', img: this.tutImg('charge') },
    { id: 't4', title: 'ชำระเงิน คูปอง และประวัติ', desc: 'ชำระค่าชาร์จผ่าน Charge X Wallet หรือบัตร เลือกใช้คูปองส่วนลด และเรียกดูการสอนใช้งานซ้ำได้จากเมนูตั้งค่า', img: this.tutImg('wallet') }
  ];
}
readSlides() {
  try {
    const raw = JSON.parse(localStorage.getItem('cx-tutorial-slides') || 'null');
    if (Array.isArray(raw)) return raw;
  } catch (e) {}
  return this.seedSlides();
}
constructor(props) {
  super(props);
  let replayed = false, from = 'News';
  try {
    replayed = localStorage.getItem('cx-tutorial-replay') === '1';
    if (replayed) localStorage.removeItem('cx-tutorial-replay');
    const f = localStorage.getItem('cx-tutorial-from');
    if (f) { from = f; localStorage.removeItem('cx-tutorial-from'); }
  } catch (e) {}
  this.state = { slides: this.readSlides(), step: 0, autoPlay: false, replayed, from };
}
componentDidMount() {
  if (typeof window !== 'undefined') {
    this._tutS = (e) => {
      if (e && e.key === 'cx-tutorial-slides') {
        const slides = this.readSlides();
        this.setState({ slides, step: Math.min(this.state.step, Math.max(0, slides.length - 1)) });
      }
    };
    window.addEventListener('storage', this._tutS);
  }
}
componentWillUnmount() {
  clearInterval(this._playT);
  if (this._tutS && typeof window !== 'undefined') window.removeEventListener('storage', this._tutS);
}
renderVals() {
  const accent = this.props.accent ?? '#FC3901';
  const dark = this.props.theme === 'dark';
  const st = this.state;
  const slides = st.slides || [];
  const tot = slides.length;
  const step = tot ? Math.max(0, Math.min(tot - 1, st.step || 0)) : 0;
  const cur = slides[step] || { title: '', desc: '', img: this.tutImg('map') };
  const retScreen = ['News', 'Profile', 'Prefs', 'Help'].indexOf(st.from) >= 0 ? st.from : 'News';
  const finishHref = retScreen + (dark ? 'Dark' : '') + '.dc.html';
  const markDone = () => {
    clearInterval(this._playT);
    try { localStorage.setItem('cx-tutorial-seen', '1'); } catch (e) {}
  };
  const go = (i) => {
    if (!tot) return;
    clearInterval(this._playT);
    this.setState({ autoPlay: false, step: Math.max(0, Math.min(tot - 1, i)) });
  };
  return {
    accent,
    hasSlides: tot > 0,
    noSlides: tot === 0,
    canAutoPlay: tot > 1,
    isReplayed: !!st.replayed,
    finishHref,
    markDone,
    slideBadge: 'หน้า ' + (step + 1) + ' / ' + Math.max(1, tot),
    pageBadge: 'หน้าที่ ' + (step + 1),
    curImg: cur.img || this.tutImg('map'),
    curTitle: cur.title || '',
    curDesc: cur.desc || '',
    notLast: step < tot - 1,
    isLast: tot > 0 && step >= tot - 1,
    playLabel: st.autoPlay ? 'หยุดอัตโนมัติ' : 'เล่นอัตโนมัติ',
    playBtnStyle: 'height: 34px; padding: 0 11px; border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; ' + (st.autoPlay ? 'border: 0; background: ' + accent + '; color: #FFFFFF' : 'border: 1px solid #E0E0E0; background: #FFFFFF; color: #3A3A3A'),
    togglePlay: () => {
      if (tot < 2) return;
      clearInterval(this._playT);
      const nextOn = !this.state.autoPlay;
      this.setState({ autoPlay: nextOn });
      if (nextOn) {
        this._playT = setInterval(() => {
          const list = this.state.slides || [];
          if (!list.length || !this.state.autoPlay) { clearInterval(this._playT); return; }
          this.setState({ step: ((this.state.step || 0) + 1) % list.length });
        }, 3200);
      }
    },
    dots: slides.map((_, i) => ({
      aria: 'สไลด์ที่ ' + (i + 1),
      go: () => go(i),
      style: 'width: ' + (i === step ? '22px' : '8px') + '; height: 8px; padding: 0; border: 0; border-radius: 999px; cursor: pointer; background: ' + (i === step ? accent : '#D4D4D4')
    })),
    prev: () => go(step > 0 ? step - 1 : tot - 1),
    next: () => go(step + 1),
    replay: () => go(0)
  };
}
}
</script>
</body>
