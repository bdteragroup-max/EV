<div data-theme="{{theme}}" ref="{{cxRef}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1F1F1F; font-family: Sarabun, 'Segoe UI', sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><dc-import name="News" lang="{{cxLangProp}}" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><dc-import name="News" lang="{{cxLangProp}}" theme="dark" hint-size="390px,844px"></dc-import></sc-if>
</div>

<div style="position: absolute; inset: 0; z-index: 5"></div>
<sc-if value="{{hasSlides}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" class="cx-ringp" style="position: absolute; z-index: 6; left: {{sx}}px; top: {{sy}}px; width: {{sw}}px; height: {{sh}}px; border-radius: {{sr}}px; outline: 2px solid rgba(255,255,255,0.92); outline-offset: 2px; transition: left .45s cubic-bezier(.65,0,.35,1), top .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1), height .45s cubic-bezier(.65,0,.35,1), border-radius .45s; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: 5; left: {{sx}}px; top: {{sy}}px; width: {{sw}}px; height: {{sh}}px; border-radius: {{sr}}px; box-shadow: 0 0 0 1400px rgba(10,10,12,0.7); transition: left .45s cubic-bezier(.65,0,.35,1), top .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1), height .45s cubic-bezier(.65,0,.35,1), border-radius .45s; pointer-events: none"></div>
</sc-if>

<div style="position: absolute; z-index: 7; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; min-width: 0">
<sc-if value="{{isReplayed}}" hint-placeholder-val="{{ false }}">
<span style="padding: 4px 9px; border-radius: 999px; background: rgba(252,57,1,0.28); border: 1px solid rgba(255,160,120,0.45); color: #FFFFFF; font-size: 11px; font-weight: 600; backdrop-filter: blur(8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">แสดงการสอนใช้งานซ้ำจากเมนูตั้งค่า</span>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 6px; flex: none">
<a href="{{finishHref}}" onClick="{{markDone}}" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.18); color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; backdrop-filter: blur(8px)">ข้าม</a>
</div>
</div>

<sc-if value="{{hasSlides}}" hint-placeholder-val="{{ true }}">
<div role="dialog" aria-label="{{curTitle}}" class="cx-tip" style="position: absolute; z-index: 8; left: 18px; right: 18px; top: {{tipTopCss}}; bottom: {{tipBotCss}}; background: #FFFFFF; border-radius: 22px; padding: 18px 18px 16px; box-shadow: 0 18px 42px rgba(0,0,0,0.34); transform-origin: {{tipOrigin}}">
<sc-if value="{{tipArrowTop}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; left: {{tipAx}}px; top: -7px; width: 16px; height: 16px; background: #FFFFFF; transform: rotate(45deg); border-radius: 3px"></span>
</sc-if>
<sc-if value="{{tipArrowBot}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; left: {{tipAx}}px; bottom: -7px; width: 16px; height: 16px; background: #FFFFFF; transform: rotate(45deg); border-radius: 3px"></span>
</sc-if>
<div style="display: flex; gap: 12px; align-items: flex-start; position: relative">
<span class="cx-badge" style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: {{accent}}; color: #FFFFFF; font-family: Sarabun, sans-serif; font-weight: 700; font-size: 16.5px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(252,57,1,0.35)">{{stepNo}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Sarabun, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.35; color: #1F1F1F">{{curTitle}}</span>
<span style="font-size: 14px; line-height: 1.6; color: #5C5C5C">{{curDesc}}</span>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 8px; position: relative">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12.5px; font-weight: 700; color: #6B6B6B; white-space: nowrap">{{slideBadge}}</span>
<div style="display: flex; align-items: center; gap: 5px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<button type="button" aria-label="{{d.aria}}" onClick="{{d.go}}" style="{{d.style}}"></button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 7px">
<sc-if value="{{notFirst}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{prev}}" style="height: 38px; padding: 0 13px; border-radius: 12px; border: 1.5px solid #E0E0E0; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #3A3A3A; cursor: pointer">ย้อนกลับ</button>
</sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{next}}" style="height: 38px; padding: 0 18px; border-radius: 12px; border: 0; background: {{accent}}; font-family: inherit; font-size: 14.5px; font-weight: 700; color: #FFFFFF; cursor: pointer">ถัดไป</button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<a href="{{finishHref}}" onClick="{{markDone}}" style="height: 38px; padding: 0 18px; border-radius: 12px; background: {{accent}}; font-size: 14.5px; font-weight: 700; color: #FFFFFF; text-decoration: none; display: flex; align-items: center">เริ่มใช้งาน</a>
</sc-if>
</div>
</div>
<sc-if value="{{notFirst}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{replay}}" style="margin-top: 8px; padding: 2px 0; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #6B6B6B; cursor: pointer">แสดงซ้ำตั้งแต่หน้าแรก</button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{noSlides}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 8; background: rgba(10,10,12,0.72); display: flex; align-items: center; justify-content: center; padding: 24px">
<div style="width: 100%; background: #FFFFFF; border-radius: 22px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 17px; font-weight: 700; color: #1F1F1F">ยังไม่มีหน้าการสอนใช้งาน</span>
<span style="font-size: 13.5px; color: #5C5C5C">กรุณาเพิ่มหน้าสไลด์จาก Back Office แล้วเปิดใหม่อีกครั้ง</span>
<a href="{{finishHref}}" onClick="{{markDone}}" style="height: 44px; border-radius: 14px; background: {{accent}}; font-size: 15px; font-weight: 700; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center">กลับเข้าสู่แอป</a>
</div>
</div>
</sc-if>
</div>
</x-dc>
