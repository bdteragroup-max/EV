toggleLang: () => { const id = this.state.lang === 'en' ? 'th' : 'en'; try { localStorage.setItem('cx-lang', id); } catch (e) {} this.setState({ lang: id }); try { window.dispatchEvent(new Event('cx-lang')); const fr = window.top && window.top.frames; if (fr) for (let i = 0; i < fr.length; i++) { try { if (fr[i] !== window) fr[i].dispatchEvent(new Event('cx-lang')); } catch (e) {} } } catch (e) {} },
replay: () => {
this.setState({ show: false });
clearTimeout(this._t);
this._t = setTimeout(() => this.setState({ show: true }), 40);
}
};
}
}
</script>
