<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Charge X — รถของฉัน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C42D00}a:hover{color:#9E2400}
[data-theme="dark"]{color-scheme:dark}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: #FFFFFF"]{background-color:#1C1C1E!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: #F4F4F4"],[style*="background: #F6F6F6"],[style*="background: #F0F0F0"],[style*="background: rgb(244, 244, 244)"]){background-color:#25252A!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: #1F1F1F"]{background-color:#2C2C31!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: #FFF1EB"],[style*="background: #FFE4DA"]){background-color:rgba(252,57,1,.18)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: #FFF7F3"]{background-color:rgba(252,57,1,.1)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: #E7F6EE"]{background-color:rgba(46,180,110,.18)!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="color: #1F1F1F"],[style*="color: #2B2B2B"]){color:#F3F3F4!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: #3A3A3A"]{color:#DCDCE0!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="color: #5C5C5C"],[style*="color: #6B6B6B"],[style*="color: rgb(92, 92, 92)"]){color:#A6A6AD!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="color: #C42D00"],[style*="color: rgb(196, 45, 0)"]){color:#FF7A4D!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: #146C3E"]{color:#5AD49B!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="solid #E6E6E6"],[style*="solid #E0E0E0"],[style*="solid #EDEDED"],[style*="solid #EFEFEF"]){border-color:#35353B!important}
[data-theme="dark"] [stroke="#1F1F1F"]{stroke:#F3F3F4}
[data-theme="dark"][data-theme][style]{background-color:#000000!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="margin-top: -24px; background: #FFFFFF"]{background-color:#000000!important}
[data-theme="dark"][data-theme][style]{color:#F3F3F4!important}
[data-theme="dark"] :is(button,input,textarea,select,legend,label){color:inherit}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="color: rgb(31, 31, 31)"],[style*="color: rgb(43, 43, 43)"],[style*="color: rgb(0, 0, 0)"],[style*="color: #000"],[style*="color: black"],[style*="color: #1f1f1f"]){color:#F3F3F4!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: rgb(58, 58, 58)"]{color:#DCDCE0!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="color: rgb(92, 92, 92)"],[style*="color: rgb(107, 107, 107)"]){color:#A6A6AD!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: rgb(196, 45, 0)"]{color:#FF7A4D!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: rgb(20, 108, 62)"]{color:#5AD49B!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: rgb(255, 255, 255)"],[style*="background-color: rgb(255, 255, 255)"]){background-color:#1C1C1E!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: rgb(244, 244, 244)"],[style*="background: rgb(246, 246, 246)"],[style*="background: rgb(240, 240, 240)"],[style*="background-color: rgb(244, 244, 244)"],[style*="background-color: rgb(246, 246, 246)"]){background-color:#25252A!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: rgb(31, 31, 31)"]{background-color:#2C2C31!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: rgb(255, 241, 235)"],[style*="background: rgb(255, 228, 218)"]){background-color:rgba(252,57,1,.18)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: rgb(255, 247, 243)"]{background-color:rgba(252,57,1,.12)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: rgb(231, 246, 238)"]{background-color:rgba(46,180,110,.18)!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: rgb(230, 230, 230)"],[style*="background: rgb(237, 237, 237)"],[style*="background: rgb(239, 239, 239)"],[style*="background: rgb(217, 217, 217)"],[style*="background: rgb(218, 218, 218)"]){background-color:#35353B!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: rgb(51, 51, 51)"]{background-color:#3A3A40!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: rgb(189, 189, 189)"]{background-color:#55555C!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="linear-gradient(rgb(255, 255, 255)"]{background:linear-gradient(#000000 72%,rgba(0,0,0,0))!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="repeating-linear-gradient(90deg, rgb(218, 218, 218)"]{background:repeating-linear-gradient(90deg,#3A3A40 0 6px,transparent 6px 12px)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: rgb(158, 36, 0)"]{color:#FF8A66!important}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="solid rgb(230, 230, 230)"],[style*="solid rgb(224, 224, 224)"],[style*="solid rgb(237, 237, 237)"],[style*="solid rgb(239, 239, 239)"],[style*="solid rgb(212, 212, 212)"],[style*="solid rgb(226, 226, 226)"],[style*="solid rgb(253, 211, 195)"]){border-color:#35353B!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="margin-top: -24px; background: rgb(255, 255, 255)"]{background-color:#000000!important}
.cx-scroll{scrollbar-width:none}.cx-scroll>*{flex-shrink:0}.cx-scroll::-webkit-scrollbar{display:none}
@keyframes cxSheet{from{transform:translateY(100%)}to{transform:none}}
.cx-sheet{animation:cxSheet .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes cxFade{from{opacity:0}to{opacity:1}}
.cx-fade{animation:cxFade .3s ease-out both}
@keyframes cxSpin{to{transform:rotate(360deg)}}
.cx-spin{animation:cxSpin .8s linear infinite;transform-origin:center}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="color: #B86A00"],[style*="color: rgb(184, 106, 0)"]){color:#F0A84A!important}
@media (prefers-reduced-motion: reduce){.cx-sheet,.cx-fade,.cx-spin{animation:none}}

[data-theme="dark"] [style*="background: #FFF4E0"],[data-theme="dark"] [style*="background: rgb(255, 244, 224)"]{background-color:rgba(240,160,48,.16)!important}
@keyframes cxPlug{0%,100%{opacity:.35}50%{opacity:1}}
.cx-plugdot{animation:cxPlug 1.2s ease-in-out infinite}

:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: #1F1F1F; color: #FFFFFF"]{background-color:#1C1C1E!important}
[data-theme="dark"] .cx-qr{background:#FFFFFF!important;border-color:#FFFFFF!important}
[data-theme="dark"] .cx-qr span[style*="color: #6B6B6B"]{color:#6B6B6B!important}
[data-theme="dark"] .cx-ring{box-shadow:0 0 0 10px rgba(46,180,110,.2)!important}
@keyframes cxPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cx-pop{animation:cxPop .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes cxRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cx-rise{animation:cxRise .5s cubic-bezier(.2,.8,.3,1) .2s both}
@media (prefers-reduced-motion: reduce){.cx-pop,.cx-rise{animation:none}}
[data-theme="dark"] .cx-pv{box-shadow:0 14px 30px rgba(0,0,0,.6)!important}
.cx-in2{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:1.5px solid #E0E0E0;background:#FFFFFF;padding:0 14px;font-family:inherit;font-size:16px;color:#1F1F1F;outline:none}
.cx-in2:focus{border-color:#FC3901}
[data-theme="dark"] .cx-in2{background:#1C1C1E;border-color:#35353B;color:#F3F3F4}
[data-theme="dark"] .cx-in2:focus{border-color:#FC3901}
.cx-in2::placeholder{color:#9A9A9A}
@keyframes cxShake{0%,100%{transform:none}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.cx-shake{animation:cxShake .45s ease-in-out both}
:is([data-theme="dark"],[data-theme="dark"] *):is([style*="background: #FDECEC"]){background-color:rgba(229,62,62,.18)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="color: #B42318"]{color:#FF8A80!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="background: #FFF4E0"]{background-color:rgba(240,160,48,.16)!important}
:is([data-theme="dark"],[data-theme="dark"] *)[style*="dashed #D4D4D4"]{border-color:#45454C!important}
</style>
</helmet>
<div data-theme="{{theme}}" ref="{{cxRef}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F6F6; color: #1F1F1F; font-family: Sarabun, 'Segoe UI', sans-serif; display: flex; flex-direction: column">
<div style="padding: 56px 20px 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
<a href="{{L.Profile}}" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E6E6E6; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; text-align: center; font-family: Sarabun, sans-serif; font-weight: 700; font-size: 19px">รถของฉัน</h1>
<span></span>
</div>
<div class="cx-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{hasCars}}" hint-placeholder-val="{{ true }}">
<span style="padding: 0 4px; font-size: 13px; color: #6B6B6B">รถทั้งหมด ({{count}} คัน) · รถหลักใช้เป็นค่าเริ่มต้นตอนเริ่มชาร์จ</span>
<sc-for list="{{cars}}" as="v" hint-placeholder-count="2">
<div style="background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: {{v.border}}">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 92px; height: 56px; flex: none; border-radius: 14px; background: #F4F4F4; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="84" height="40" viewBox="0 0 84 40"><path d="M6 28c0-4 2-7 6-8l10-3 9-8c2-1.5 4-2 6-2h16c3 0 5 1 7 3l7 7 9 2c3 .8 5 3 5 6v3c0 1.5-1 2.5-2.5 2.5H8.5C7 30.5 6 29.5 6 28z" fill="{{v.color}}" stroke="{{v.stroke}}" stroke-width="1.4"></path><path d="M33 11h11v8H25zM47 11h8c1.5 0 3 .6 4 1.7l5 5.3H47z" fill="#2B3A4A" opacity="0.85"></path><circle cx="22" cy="31" r="6" fill="#1F1F1F"></circle><circle cx="22" cy="31" r="2.6" fill="#BDBDBD"></circle><circle cx="64" cy="31" r="6" fill="#1F1F1F"></circle><circle cx="64" cy="31" r="2.6" fill="#BDBDBD"></circle><path d="M72 19.5h4" stroke="#FC3901" stroke-width="2" stroke-linecap="round"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700; color: #1F1F1F">{{v.name}}</span><span style="font-size: 13px; color: #6B6B6B">{{v.plate}}</span></span>
<button type="button" onClick="{{v.edit}}" aria-label="แก้ไข {{v.name}}" style="width: 38px; height: 38px; flex: none; border-radius: 12px; border: 0; background: #F4F4F4; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg></button>
<button type="button" onClick="{{v.ask}}" aria-label="ลบ {{v.name}}" style="width: 38px; height: 38px; flex: none; border-radius: 12px; border: 0; background: #F4F4F4; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</div>
<sc-if value="{{v.isMain}}" hint-placeholder-val="{{ true }}"><span style="align-self: flex-start; padding: 4px 10px; border-radius: 8px; background: #FFF1EB; color: #C42D00; font-size: 12px; font-weight: 700">✓ รถหลัก</span></sc-if>
<sc-if value="{{v.notMain}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{v.makeMain}}" style="align-self: flex-start; height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid #E0E0E0; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #3A3A3A; cursor: pointer">ตั้งเป็นรถหลัก</button></sc-if>
</div>
</sc-for>
</sc-if>
<sc-if value="{{noCars}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border-radius: 22px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 72px; height: 64px; border-radius: 20px; background: #FFF1EB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FC3901" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 7l2 6v4h-2.5M5.5 17H3v-4h18"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg></span>
<span style="font-size: 16px; font-weight: 700; color: #1F1F1F">ยังไม่มีรถในบัญชี</span>
<span style="font-size: 13px; line-height: 1.55; color: #6B6B6B">เพิ่มรถของคุณ เพื่อให้แอปแนะนำสถานีและหัวชาร์จที่เหมาะสม</span>
</div>
</sc-if>
<button type="button" onClick="{{openAdd}}" style="height: 56px; border-radius: 18px; border: 1.5px dashed #D4D4D4; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #C42D00; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C42D00" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>เพิ่มรถ</button>
</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div class="cx-fade" role="status" style="position: absolute; left: 16px; right: 16px; bottom: 30px; z-index: 30; padding: 12px 14px; border-radius: 16px; background: #1F1F1F; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5AD49B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div>
</sc-if>

<sc-if value="{{showDel}}" hint-placeholder-val="{{ false }}">
<div class="cx-fade" style="position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: flex-end">
<button type="button" aria-label="ปิด" onClick="{{cancelDel}}" style="flex: 1; border: 0; background: transparent; cursor: pointer"></button>
<div class="cx-sheet" role="alertdialog" aria-label="ยืนยันการลบรถ" style="background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 40px; height: 4px; border-radius: 2px; background: #DADADA"></span>
<span style="margin-top: 6px; font-family: Sarabun, sans-serif; font-weight: 700; font-size: 18px; color: #1F1F1F">ลบ {{delName}} ออกจากบัญชี?</span>
<span style="font-size: 13.5px; line-height: 1.55; color: #6B6B6B">{{delHint}}</span>
<div style="align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px">
<button type="button" onClick="{{cancelDel}}" style="height: 50px; border-radius: 14px; border: 1.5px solid #E0E0E0; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #1F1F1F; cursor: pointer">ยกเลิก</button>
<button type="button" onClick="{{doDel}}" style="height: 50px; border-radius: 14px; border: 0; background: #E5484D; font-family: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; cursor: pointer">ลบรถ</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{showForm}}" hint-placeholder-val="{{ false }}">
<div class="cx-sheet" role="dialog" aria-label="{{formTitle}}" style="position: absolute; inset: 0; z-index: 45; background: #F6F6F6; display: flex; flex-direction: column">
<div style="padding: 56px 20px 8px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
<button type="button" onClick="{{closeForm}}" aria-label="ปิด" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E6E6E6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<h2 style="margin: 0; text-align: center; font-family: Sarabun, sans-serif; font-weight: 700; font-size: 19px">{{formTitle}}</h2>
<span></span>
</div>
<div class="cx-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 120px; border-radius: 22px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<sc-for list="{{preview}}" as="v" hint-placeholder-count="1"><span style="transform: scale(1.7); transform-origin: center; display: flex"><svg aria-hidden="true" width="84" height="40" viewBox="0 0 84 40"><path d="M6 28c0-4 2-7 6-8l10-3 9-8c2-1.5 4-2 6-2h16c3 0 5 1 7 3l7 7 9 2c3 .8 5 3 5 6v3c0 1.5-1 2.5-2.5 2.5H8.5C7 30.5 6 29.5 6 28z" fill="{{v.color}}" stroke="{{v.stroke}}" stroke-width="1.4"></path><path d="M33 11h11v8H25zM47 11h8c1.5 0 3 .6 4 1.7l5 5.3H47z" fill="#2B3A4A" opacity="0.85"></path><circle cx="22" cy="31" r="6" fill="#1F1F1F"></circle><circle cx="22" cy="31" r="2.6" fill="#BDBDBD"></circle><circle cx="64" cy="31" r="6" fill="#1F1F1F"></circle><circle cx="64" cy="31" r="2.6" fill="#BDBDBD"></circle><path d="M72 19.5h4" stroke="#FC3901" stroke-width="2" stroke-linecap="round"></path></svg></span></sc-for>
<span style="margin-top: 14px; font-size: 15px; font-weight: 700; color: #1F1F1F">{{pvName}}</span>
</div>
<div style="background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #3A3A3A">ยี่ห้อ</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{brands}}" as="b" hint-placeholder-count="9"><button type="button" role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button></sc-for>
</div>
<sc-if value="{{isOther}}" hint-placeholder-val="{{ false }}"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A3A3A">ระบุยี่ห้อ<input class="cx-in2" value="{{fOther}}" onInput="{{onOther}}" placeholder="ยี่ห้อรถ"></label></sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A3A3A">รุ่น<input class="cx-in2" value="{{fModel}}" onInput="{{onModel}}" placeholder="เช่น Atto 3, ZS EV, Model Y"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A3A3A">ทะเบียนรถ (ไม่บังคับ)<input class="cx-in2" value="{{fPlate}}" onInput="{{onPlate}}" placeholder="เช่น 1กข 1234 กรุงเทพฯ"></label>
<span style="font-size: 13px; font-weight: 600; color: #3A3A3A">สีรถ</span>
<div style="display: flex; gap: 10px">
<sc-for list="{{colors}}" as="cl" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{cl.on}}" aria-label="{{cl.name}}" onClick="{{cl.pick}}" style="width: 36px; height: 36px; border-radius: 50%; cursor: pointer; background: {{cl.hex}}; border: {{cl.bd}}; box-shadow: {{cl.ring}}"></button></sc-for>
</div>

static {

}
constructor(props) { super(props); this.state = Object.assign({ cars: this.seed(props.cars), main: props.cars === 'ยังไม่มีรถ' ? null : 1, del: null, toast: '', f: null }, this.screenState(props.screen)); }

componentDidUpdate(pp) {
if (pp.screen !== this.props.screen) this.setState(this.screenState(this.props.screen));
if (pp.cars !== this.props.cars) this.setState({ cars: this.seed(this.props.cars), main: this.props.cars === 'ยังไม่มีรถ' ? null : 1 });
}
componentWillUnmount() { clearTimeout(this._toast); }
sync(cars, main) { cars = cars || this.state.cars; main = main === undefined ? this.state.main : main; const m = cars.find((c) => c.id === main); try { localStorage.setItem('cx-car', JSON.stringify(m ? { name: m.brand + ' ' + m.model, plate: m.plate, count: cars.length } : { name: '', plate: '', count: 0 })); } catch (e) {} }

const nameOf = (c) => c.brand + ' ' + c.model;
const strokeOf = (hex) => hex === '#FFFFFF' ? '#BDBDBD' : 'rgba(0,0,0,0.25)';
const cars = st.cars.map((c) => { const isMain = st.main === c.id; return {
name: nameOf(c), plate: c.plate || 'ยังไม่ระบุทะเบียน', color: c.color, stroke: strokeOf(c.color), isMain, notMain: !isMain,
border: isMain ? '1.5px solid ' + accent : '1px solid transparent',
makeMain: () => { this.setState({ main: c.id }); this.sync(null, c.id); toast('ตั้ง ' + nameOf(c) + ' เป็นรถหลักแล้ว'); },

ask: () => this.setState({ del: c.id }) }; });
const BR = ['BYD', 'MG', 'Tesla', 'ORA', 'NETA', 'Chery', 'Volvo', 'BMW', 'อื่นๆ'];
const f = st.f;
const delCar = st.cars.find((c) => c.id === st.del);
const fBrand = f ? (f.brand === 'อื่นๆ' ? f.other.trim() : f.brand) : '';
const valid = !!f && !!fBrand && !!f.model.trim();
const setF = (k) => (e) => this.setState({ f: Object.assign({}, this.state.f, { [k]: e.target.value }) });

accent, cars, count: st.cars.length, hasCars: st.cars.length > 0, noCars: st.cars.length === 0,
showToast: !!st.toast, toast: st.toast,
showDel: !!delCar, delName: delCar ? nameOf(delCar) : '',
delHint: delCar && st.main === delCar.id && st.cars.length > 1 ? 'คันนี้เป็นรถหลัก ระบบจะตั้งรถคันถัดไปเป็นรถหลักแทน' : 'ประวัติการชาร์จของรถคันนี้ยังคงอยู่ในบัญชี',

const rec = { brand: fBrand, model: f.model.trim(), plate: f.plate.trim(), color: f.color };
