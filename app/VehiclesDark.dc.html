<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Charge X — รถของฉัน (โหมดมืด)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; font-family: Sarabun, 'Segoe UI', sans-serif">
<dc-import name="Vehicles" theme="dark" lang="{{lang}}" screen="{{screen}}" cars="{{cars}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["รายการรถ","เพิ่มรถ"],"default":"รายการรถ"},"cars":{"editor":"enum","options":["มีรถ 2 คัน","ยังไม่มีรถ"],"default":"มีรถ 2 คัน"},"lang":{"editor":"enum","options":["ตามแอป","ไทย","English"],"default":"ตามแอป"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { screen: this.props.screen ?? 'รายการรถ', cars: this.props.cars ?? 'มีรถ 2 คัน', lang: this.props.lang ?? 'ตามแอป' }; }
}
</script>
</body>
</html>
