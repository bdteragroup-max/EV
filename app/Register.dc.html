<div data-theme="{{theme}}" ref="{{cxRef}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1F1F1F; font-family: Sarabun, 'Segoe UI', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 36px">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">

</div>
</div>

<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5C5C5C">ใช้สำหรับออกใบเสร็จและแนะนำหัวชาร์จที่เหมาะกับรถของคุณ</p>
</div>

<form style="display: flex; flex-direction: column; gap: 14px; margin-top: 18px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">

</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cx-ln" style="font-size: 13px; font-weight: 600; color: #3A3A3A">นามสกุล <span style="color: #C42D00">*</span></label>
<input id="cx-ln" class="cx-in" placeholder="นามสกุล">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cx-ph" style="font-size: 13px; font-weight: 600; color: #3A3A3A">หมายเลขโทรศัพท์</label>
<div style="height: 50px; border-radius: 14px; background: #F4F4F4; display: flex; align-items: center; gap: 10px; padding: 0 14px">
<input id="cx-ph" value="+66 [หมายเลขโทรศัพท์]" readonly="" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15px; font-family: inherit; color: #3A3A3A; outline: none">
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #146C3E"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#146C3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>ยืนยันแล้ว</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cx-em" style="font-size: 13px; font-weight: 600; color: #3A3A3A">อีเมล <span style="font-weight: 500; color: #6B6B6B">(สำหรับรับใบเสร็จ)</span></label>

</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cx-car" style="font-size: 13px; font-weight: 600; color: #3A3A3A">รถของคุณ</label>
<div style="position: relative">
<input id="cx-car" class="cx-in" placeholder="ยี่ห้อและรุ่น" value="Chery Q" style="padding-right: 40px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 14px; top: 17px"><path d="m6 9 6 6 6-6"></path></svg>
</div>
</div>

</form>

<div style="flex: 1"></div>

<label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin-bottom: 14px">
<button type="button" role="checkbox" aria-checked="{{agreeStr}}" aria-label="ยอมรับข้อกำหนด" onClick="{{toggleAgree}}" style="width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid {{boxBorder}}; background: {{boxBg}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; margin-top: 1px">
<sc-if value="{{agree}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg></sc-if>
</button>
<span style="font-size: 13px; line-height: 1.55; color: #5C5C5C">ฉันยอมรับ<a href="{{L.Privacy}}" onClick="{{toTerms}}">ข้อกำหนดการให้บริการ</a>และ<a href="{{L.Privacy}}" onClick="{{toPolicy}}">นโยบายความเป็นส่วนตัว</a></span>
</label>

<a href="{{L.Guide}}" style="height: 56px; border-radius: 16px; background: {{btnBg}}; color: #FFFFFF; font-family: Sarabun, sans-serif; font-weight: 600; font-size: 19px; text-decoration: none; display: flex; align-items: center; justify-content: center">ยืนยันและเริ่มใช้งาน</a>
</div>
</x-dc>
