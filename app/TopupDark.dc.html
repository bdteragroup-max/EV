<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Charge X — เติมเงิน (โหมดมืด)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; font-family: Sarabun, 'Segoe UI', sans-serif">
<dc-import name="Topup" theme="dark" lang="{{lang}}" screen="{{screen}}" bankResult="{{bankResult}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["เลือกยอด","สแกน QR","เลือกธนาคาร","รอยืนยันธนาคาร","ไม่สำเร็จ","สำเร็จ"],"default":"เลือกยอด"},"bankResult":{"editor":"enum","options":["สำเร็จ","ไม่สำเร็จ"],"default":"สำเร็จ"},"lang":{"editor":"enum","options":["ตามแอป","ไทย","English"],"default":"ตามแอป"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { screen: this.props.screen ?? 'เลือกยอด', bankResult: this.props.bankResult ?? 'สำเร็จ', lang: this.props.lang ?? 'ตามแอป' }; }
}
</script>
</body>
</html>
