<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<h1 style="margin: 0; font-family: Sarabun, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.3">การแจ้งเตือน</h1>
<sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{unread}}</span></sc-if>
</div>
<button onClick="{{readAll}}" disabled="{{noUnread}}" style="height: 36px; padding: 0 4px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: {{readAllColor}}; cursor: pointer">อ่านทั้งหมด</button>
</div>
<div class="cx-scroll" role="tablist" aria-label="ประเภทการแจ้งเตือน" style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div class="cx-scroll" style="flex: 1; overflow-y: auto; padding: 4px 16px 34px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<sc-if value="{{n.showHead}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; color: #6B6B6B; margin: 10px 4px 2px">{{n.head}}</span></sc-if>
<a href="{{n.href}}" onClick="{{n.read}}" class="cx-item" style="{{n.cardStyle}}">
<span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: {{n.tileBg}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.tileFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: baseline; gap: 8px"><span style="flex: 1; font-weight: 700; font-size: 15px; line-height: 1.35; color: #1F1F1F">{{n.title}}</span><span style="font-size: 12px; color: #6B6B6B; flex: none">{{n.time}}</span></span>
<span style="font-size: 13.5px; line-height: 1.55; color: #5C5C5C">{{n.body}}</span>
</span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}"><span aria-label="ยังไม่ได้อ่าน" style="position: absolute; top: 16px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span></sc-if>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 80px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
<span style="font-weight: 600; font-size: 16px; color: #1F1F1F">ยังไม่มีการแจ้งเตือน</span>
<span style="font-size: 14px; color: #6B6B6B">การแจ้งเตือนในหมวดนี้จะแสดงที่นี่</span>
</div>
</sc-if>
</div>
</div>
