return { has, d: code[i] || '', caret: active,
style: 'height: 58px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background .2s; border: ' + (active || done ? '2px' : '1.5px') + ' solid ' + border + '; background: ' + (done ? '#E7F6EE' : '#FFFFFF') + (active ? '; box-shadow: 0 0 0 4px rgba(252,57,1,0.12)' : '') };
});
const add = (n) => () => { if (this.state.code.length < 6) this.setState({ code: this.state.code + n }); };
const kp = { del: () => this.setState({ code: this.state.code.slice(0, -1) }) };
for (let n = 0; n <= 9; n++) kp['k' + n] = add(String(n));
const left = this.state.left;
return {
accent, boxes, kp, done,
okCls: done ? 'cx-ok' : '',
counting: !done && left > 0,
canResend: !done && left === 0,
timer: '00:' + String(left).padStart(2, '0'),
resend: () => this.setState({ left: 45, code: '' }),
showSms: !done,
autofill: () => this.setState({ code: '482913' }),
btnBg: done ? accent : '#BDBDBD',
btnPe: done ? 'auto' : 'none',
notDoneStr: done ? 'false' : 'true'
};
}
}
