<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Charge X — เข้าสู่ระบบสมาชิก (โหมดมืด)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; font-family: Sarabun, 'Segoe UI', sans-serif">
<dc-import name="Member" theme="dark" lang="{{lang}}" biometric="{{biometric}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"biometric":{"editor":"enum","options":["ทั้งสองแบบ","Face ID อย่างเดียว","ลายนิ้วมืออย่างเดียว","ไม่รองรับ"],"default":"ทั้งสองแบบ"},"lang":{"editor":"enum","options":["ตามแอป","ไทย","English"],"default":"ตามแอป"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { biometric: this.props.biometric ?? "ทั้งสองแบบ", lang: this.props.lang ?? 'ตามแอป' }; }
}
</script>
</body>
</html>
