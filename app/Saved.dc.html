</div>

<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
<span style="flex: 1"></span>
<span style="align-self: center; font-size: 12.5px; color: #6B6B6B">เรียงตามระยะทาง</span>
</div>
</sc-if>
<div class="cx-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">

</div>
</div>
</sc-for>

<span style="font-size: 16px; font-weight: 700; color: #1F1F1F">ยังไม่มีสถานีที่บันทึกไว้</span>
<span style="font-size: 13px; line-height: 1.55; color: #6B6B6B">กดรูปหัวใจในหน้ารายละเอียดสถานี เพื่อบันทึกสถานีที่ใช้บ่อย</span>
<a href="{{L.Home}}" style="margin-top: 8px; height: 46px; padding: 0 20px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">ค้นหาสถานีบนแผนที่</a>
</div>
</sc-if>
</div>

</sc-if>
</div>
