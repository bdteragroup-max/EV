<div data-theme="{{theme}}" ref="{{cxRef}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F6; color: #1F1F1F; font-family: Sarabun, 'Segoe UI', sans-serif; position: relative; overflow: hidden">
<div style="padding: 56px 16px 100px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<div style="display: flex; align-items: center; gap: 10px">
<img src="img/40a68032ae1c879ecedb4032e727cb86.png" alt="TERA Charge-X" style="height: 44px; width: auto; display: block">
<span style="display: flex; flex-direction: column">
<span style="font-size: 13px; color: #5C5C5C">สวัสดี</span>
<span style="font-family: Sarabun, sans-serif; font-weight: 600; font-size: 19px; line-height: 1.3">คุณ Sawanya</span>
</span>
</div>
<div style="display: flex; gap: 8px">
<a href="{{F.News}}" aria-label="สลับโหมดมืด" aria-pressed="{{darkStr}}" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E6E6E6; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC24D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
</a>
<a href="{{L.Notify}}" aria-label="การแจ้งเตือน (3 รายการใหม่)" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E6E6E6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: {{accent}}; border: 2px solid #FFFFFF"></span>
</a>
</div>
</div>

<div style="height: 64px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px">
<span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F7EFD6; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8860B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3zM3 10h18M16 15h2"></path></svg></span>
<a href="{{L.Wallet}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; text-decoration: none; color: #1F1F1F"><span style="font-size: 12.5px; color: #6B6B6B">ยอดเงินใน Wallet</span><span style="font-family: Sarabun, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25; color: #1F1F1F">฿500.00</span></a>
<a href="{{L.Topup}}" style="height: 38px; padding: 0 14px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 4px; flex: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>เติมเงิน</a>

<div style="display: flex; flex-direction: column; gap: 8px">

<sc-for list="{{slides}}" as="s" hint-placeholder-count="3">
<a href="#" style="{{s.style}}">
<svg aria-hidden="true" width="200" height="200" viewBox="0 0 200 200" style="position: absolute; right: -40px; top: -22px"><circle cx="100" cy="100" r="78" fill="none" stroke="{{s.deco}}" stroke-width="10"></circle><path d="M40 170 165 30" stroke="{{s.deco}}" stroke-width="14" stroke-linecap="round"></path></svg>
<span style="{{s.tagStyle}}">{{s.tag}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; position: relative">
<span style="font-family: Sarabun, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.3">{{s.title}}</span>
<span style="font-size: 14px; font-weight: 500">{{s.sub}}</span>
</span>
</a>
</sc-for>
</div>
<div style="display: flex; justify-content: center; gap: 2px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<button onClick="{{d.go}}" aria-label="{{d.label}}" aria-current="{{d.cur}}" style="width: 28px; height: 20px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="{{d.style}}"></span></button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFF1EB; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FC3901" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span>
<span style="font-weight: 600; font-size: 15px">ค้นหาสถานี</span></a>
<a href="{{L.Scan}}" style="height: 64px; border-radius: 18px; background: #1F1F1F; text-decoration: none; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 12px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #333333; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"></path></svg></span>
<span style="font-weight: 600; font-size: 15px">สแกนเพื่อชาร์จ</span></a>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h1 style="margin: 0; font-family: Sarabun, sans-serif; font-weight: 600; font-size: 20px">ข่าวสารและประกาศ</h1>
<a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 0">ดูทั้งหมด</a>
</div>

<div style="display: flex; gap: 8px; margin-top: -8px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
<button onClick="{{chip.pick}}" style="{{chip.style}}">{{chip.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<a href="#" style="background: #FFFFFF; border-radius: 18px; padding: 10px; display: flex; gap: 12px; text-decoration: none; color: #1F1F1F">
<span style="width: 76px; height: 76px; border-radius: 14px; flex: none; background: {{it.thumbBg}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{it.isPromo}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"></path></svg></sc-if>
<sc-if value="{{it.isAlert}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C42D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"></path></svg></sc-if>
<sc-if value="{{it.isStation}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"></path></svg></sc-if>
<sc-if value="{{it.isNews}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13v16H6a2 2 0 0 1-2-2V4zM17 8h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3"></path></svg></sc-if>

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; justify-content: center">

<span style="font-size: 12px; color: #6B6B6B">{{it.date}}</span>
</span>
</a>

</div>
