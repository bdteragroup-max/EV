<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Charge X — Back Office (โหมดมืด)</title>
<script src="./backoffice_i18n.js"></script>
<script src="./backoffice_core.js"></script>
<script src="./backoffice_sections.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&amp;display=swap">
<style>body{margin:0;background:#0B0B0D}</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #0B0B0D; font-family: Sarabun, 'Segoe UI', sans-serif">
<dc-import name="BackOffice" theme="dark" screen="{{screen}}" lang="{{lang}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["เข้าสู่ระบบ","Super Admin (Dashboard)","Operator (Dashboard)"],"default":"เข้าสู่ระบบ"},"lang":{"editor":"enum","options":["ตามแอป","ไทย","English"],"default":"ตามแอป"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return { screen: this.props.screen ?? 'เข้าสู่ระบบ', lang: this.props.lang ?? 'ตามแอป' }; }
}
</script>
</body>
</html>
