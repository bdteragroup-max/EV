const PT = [].map(([r, e]) => [new RegExp(r), e]);
const SUB = ["ระบบจะเชื่อมต่อกับหัวชาร์จให้อัตโนมัติ", "วาง QR code ที่ตู้ชาร์จให้อยู่ในกรอบ", "มหาวิทยาลัยรามคำแหง วิทยาเขต บางนา", "สแกนไม่ได้? กรอกรหัสตู้ชาร์จ", "CCS2 · ชาร์จเร็ว DC", "เช่น TC-0000-04", "สแกนเพื่อชาร์จ", "ชาร์จเร็ว DC", "เปลี่ยน", "สแกน QR", "ยืนยัน", "ไฟฉาย", "ชื่อ", "ระบบ", "นาที", "ปิด", "กม.", "ชม."];
